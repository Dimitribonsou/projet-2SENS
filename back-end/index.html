<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>teste tuto</title>
</head>
<style>
    *{
        box-sizing: border-box;
    }
    summary
    {
        width: 500px;
        padding: 15px 25px;
        background-color: #f1f1f1f1;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: teal;
        font-weight: bold;
    }
    details
    {
        width: 500px;
        height: fit-content;
        margin:25px  auto;
    }
    details p
    {
        padding: 0;
        margin: 0;
        background-color: #f1f1f1f1;
        width: 100%;
        padding: 10px 25px;
        font-size: 20px;
    }
summary {
    list-style: none; /* Supprime l'icône par défaut */
} 


summary:after {
    content: "▶"; /* Icône personnalisée */
    color: teal; /* Couleur de l'icône */
    font-size: 1.2em; /* Taille de l'icône */
    margin-left: 5px; /* Espace entre le texte et l'icône */
    float: right; /* Positionne l'icône à droite */
}

details[open] summary:after {
    content: "▼"; /* Icône lors de l'ouverture */
}
</style>
<body>
    <details>
        <summary>dimdev C'est Qui ?</summary>
       <p> dimidev est un jeune developpeur competent exercant dans les technologies javascript</p>
    </details>
</body>
</html>

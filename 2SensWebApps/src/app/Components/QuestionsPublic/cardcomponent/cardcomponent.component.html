<div class="card py-3 px-3 shadow ">
  <div class="d-flex justify-content-between align-items-center gap-3">
    <div class="col ">
      <img src="/assets/2sensImages/profil_man.png" alt="photo profil" class="img-fluid rounded-circle" >
      <span class="user-name ms-2 fw-bold">Bonsou dimitri</span>
    </div>
    <div class="d-flex flex-column gap-1 text-end ">
       <span class="text-opacity">20/06/2024</span>
       <span class="text-opacity">16:35:25</span>
    </div>
  </div>
  <div class="card-body text-center">
    <h5 class="card-title text-two mb-4">Comment faire pour avoir le passport</h5>
    <p class="card-text text-opacity">Je desirais savoir toute les pieces necessaire pour obtenir un passport allant dans plus 20 pays en europe</p>
  </div>
  <div class="mt-3">
  <div class="card-stat col d-flex justify-content-between align-items-center gap-3">
     <div class="col ms-2 card-response">
       <span>Reponse :</span>
       <span class="text-two fw-bold ms-2">15</span>
     </div>
     <div class="card-action d-flex justify-content-end align-items-center">
       <a *ngIf="showbtnrepondre"   class="btn-one me-3" [routerLink]="['/reponses']">Repondre</a>
       <a *ngIf="showbtnvoirreponse" class="btn-one " [routerLink]="['/question-payment']" >Voir les reponses</a>
       <a *ngIf="showbtnsignaler"  class="btn-two ms-4" [routerLink]="['/signaler']">Signaler</a>
     </div>
  </div>
  </div>
</div>

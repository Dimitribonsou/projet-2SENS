<app-navbar></app-navbar>
<div class="container login d-flex justify-content-center align-items-center gap-3 mt-4">
  <div class="col-md-7 col-12  d-flex flex-column justify-content-center align-items-center gap-3">
    <h3>  CREER VOTRE COMPTE 👋</h3>
    <div class="w-75">
     <div class="col w-100 google-content ">
       <a href="#" class="google-link">
         <img src="assets/2sensImages/Google.png" alt=" logo de google">
         <span class="fw-bold text-black">CREER UN COMPTE AVEC GOOGLE</span>
       </a>
     </div>

     <div class="col my-3 d-flex justify-content-center other">
        <span class="text-center other-login">OU</span>
     </div>
     <div class="form-content mt-3">
       <form action="">
         <div class="col input-item my-3 ">
            <i></i>
            <img src="assets/2sensImages/Google.png" class="image" alt=" logo de google">
            <input type="text" name="" id="" placeholder="Entrez votre nom" class="form-control shadow-none rounded" required>
         </div>
         <div class="col input-item my-3 ">
            <i></i>
            <img src="assets/2sensImages/Google.png" class="image" alt=" logo de google">
            <input type="email" name="" id="" placeholder="Entrez votre email" class="form-control shadow-none rounded" required>
         </div>
         <div class="col input-item my-3 ">
            <i></i>
            <img src="assets/2sensImages/Google.png" class="image" alt=" logo de google">
            <input type="tel" name="" id="" placeholder="Entrez votre telephone" class="form-control shadow-none rounded" required>
         </div>
         <div class="col input-item my-3">
            <i></i>
            <img src="assets/2sensImages/Google.png" class="image" alt=" logo de google">
            <input type="password" name="" id="" placeholder="Entrez votre mot de passe" class="form-control shadow-none rounded" required>
         </div>
         <div class="my-3 ">
            <button type="submit" class="btn-one w-100">CONTINUER</button>
         </div>
        </form>
        <div class="my-4 d-flex justify-content-around align-items-center gap-3 w-100">

            <a [routerLink]="['/register']" class="text-one connect-link shadow fw-bold"> Internaute</a>

           <a [routerLink]="['/login']" class="text-one connect-link shadow fw-bold">Se connecter</a>
        </div>
     </div>
    </div>
  </div>
  <div class="bg-warning col-md-5">
    <img src="assets/2sensImages/register.png" class="img-fluid w-100" alt="image de creation compte">
  </div>
</div>
<app-footer></app-footer>

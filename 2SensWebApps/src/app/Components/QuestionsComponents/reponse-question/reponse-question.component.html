<div class="container-fluid reponse">
  <div class="reponse-header d-flex justify-content-between align-items-center gap-3 border-bottom-4 border-primary">
    <div class="col ">
      <a [routerLink]="['/questions']"><i class="bi bi-arrow-left me-md-5 me-3 text-one"></i></a>
      <img src="/assets/2sensImages/profil_man.png" alt="photo profil" class="img-fluid rounded-circle" >
      <span class="user-name ms-2 fw-bold">{{ questiondetail[0].USERNAME }}</span>
    </div>
    <div class="header-date d-flex flex-column gap-1 text-end px-3 ">
       <span class="text-opacity">{{ questiondetail[0].date | date }}</span>
       <span class="text-opacity">{{ questiondetail[0].heure }}</span>
    </div>
  </div>
  <div class=" container question-item">
    <div class=" my-3 d-flex justify-content-end">
              <!-- Button trigger modal -->
        <button type="button" class="btn-one" data-bs-toggle="modal" data-bs-target="#staticBackdrop">
          <i class="bi bi-plus-lg me-2"></i>Ajouter une reponse
        </button>

        <!-- Modal -->
        <div class="modal fade" id="staticBackdrop" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true">
          <div class="modal-dialog">
            <div class="modal-content">
              <div class="modal-header">
                <h1 class="modal-title fs-5" id="staticBackdropLabel">Repondre a cette question</h1>
                <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal" aria-label="Close"></button>
              </div>
              <div class="modal-body">
                <form action="" [formGroup]="formresponse" (ngSubmit)="SendResponse(questiondetail[0].ID_QUESTION)">
                  <textarea formControlName="response" [(ngModel)]="response" type="text" placeholder="entrer votre reponse" class="form-control shadow-none" rows="10" ></textarea>
                  <div class="modal-footer">
                    <button type="submit" class=" {{ formresponse.invalid ? 'btn-one':'btn-three' }} my-3" [disabled]="formresponse.invalid">Envoyer</button>
                    <button type="button" class="btn-two" data-bs-dismiss="modal">Annuler</button>
                    <!-- <button type="button" class="btn btn-primary">Envoyer</button> -->
                  </div>
                </form>
              </div>
            </div>
          </div>
</div>
    </div>
    <div class="row  d-flex flex-column justify-content-center align-items-center gap-1">
       <span class="text-two fw-bold my-3 text-center mt-5 fs-5">{{ questiondetail[0].titre }} ?</span>
       <p class="text-justify mt-2  text-md-center">{{ questiondetail[0].DESCRIPTION }}</p>
    </div>
    <div class="row ">
      <span class="text-two">Pieces jointes</span>
      <div class="col d-flex flex-row flex-wrap justify-content-between align-items-center gap-3 my-2 ">
       <div class="box  col-12 col-md-3 bg-light min-w-100"></div>
       <div class="box col-12 col-md-3 bg-light min-w-100"></div>
       <div class="box col-12 col-md-3 bg-light min-w-100"></div>
      </div>
    </div>
    <div class="col col-md-6 mx-auto p-3 shadow my-3 rounded-3">
       <p class="text-md-center">Vous pouvez ajouter une réponse a cette question si vous avez une idée </p>
    </div>
  </div>
</div>
